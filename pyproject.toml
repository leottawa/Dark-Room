[project]
name = "brightroom"
version = "0.1.0"
description = "BrightRoom enquiry-to-proposal assistant (HEC MSc DSAIB, Case 02)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brightroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
