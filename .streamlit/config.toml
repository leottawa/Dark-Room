# Look and feel of the review screen. Read when Streamlit starts: restart the app after editing.

[client]
# Hide the developer toolbar (Deploy button, menu) so the screen stays clean for reviewers.
toolbarMode = "minimal"

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
primaryColor = "#27365F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F3EE"
textColor = "#1C2333"
borderColor = "#E4E0D6"
linkColor = "#27365F"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.55rem"
headingFontSizes = ["2rem", "1.5rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
metricValueFontSize = "1.55rem"
greenColor = "#2F9E5B"
redColor = "#D64545"
orangeColor = "#E39B1B"
blueColor = "#3B7DD8"
dataframeHeaderBackgroundColor = "#F5F3EE"

[theme.sidebar]
backgroundColor = "#1E2A47"
secondaryBackgroundColor = "#2A385C"
textColor = "#E8ECF5"
primaryColor = "#F2B33D"
borderColor = "#3A4870"
linkColor = "#F2C66B"
